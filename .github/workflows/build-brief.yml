name: build-brief

# 每日晨報的**備援**路徑,刻意只保留手動觸發。
#
# 常態產製走排程 Claude session(台北一~五 07:52,見 README「每日晨報(自架版)」節):
# 那條路有 WebSearch——才寫得出「本週關鍵事件」——而且算在訂閱內。這條走 Anthropic
# API(約 $6/月)、沒有網路搜尋,所以 week_events 只能留空,只在排程 session 掛掉時手動跑。
#
# **兩者不可同時排程**:同一天會產兩期,期號互相踩、歷史存檔輪替也會亂。
on:
  workflow_dispatch:

concurrency:
  group: build-brief
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install anthropic pydantic

      - name: 產製晨報
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python build_brief.py

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet daily-brief.html daily-brief-card.json; then
            echo "無變更"; exit 0
          fi
          ED=$(python -c "import json;print(json.load(open('daily-brief-card.json'))['edition'])")
          git add daily-brief.html daily-brief-card.json
          git commit -m "brief: $(date -u +%Y-%m-%d) 第 ${ED} 期"
          git push
